<!DOCTYPE html>
<html>
<head>
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <h2 class="text-center mb-4">
        Student Dashboard
    </h2>

    <div class="row">

        <div class="col-3">

            <div class="card text-center">

                <div class="card-body">

                    <h5>Total Students</h5>

                    <span class="badge bg-primary">
                        320
                    </span>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card text-center">

                <div class="card-body">

                    <h5>Present Students</h5>

                    <span class="badge bg-success">
                        280
                    </span>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card text-center">

                <div class="card-body">

                    <h5>Absent Students</h5>

                    <span class="badge bg-danger">
                        40
                    </span>

                </div>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card text-center">

                <div class="card-body">

                    <h5>Placements</h5>

                    <span class="badge bg-warning text-dark">
                        210
                    </span>

                </div>

            </div>

        </div>

    </div>

    <div class="mt-4 mb-3">

        <input type="text"
               class="form-control"
               placeholder="Search Student">

    </div>

    <div class="table-responsive">

        <table class="table table-bordered">

            <thead class="table-dark">

                <tr>

                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Attendance</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>22B81A0501</td>
                    <td>Rahul</td>
                    <td>CSE</td>
                    <td>
                        <span class="badge bg-success">
                            92%
                        </span>
                    </td>

                </tr>

                <tr>

                    <td>22B81A0502</td>
                    <td>Priya</td>
                    <td>IT</td>
                    <td>
                        <span class="badge bg-success">
                            88%
                        </span>
                    </td>

                </tr>

                <tr>

                    <td>22B81A0503</td>
                    <td>Kiran</td>
                    <td>ECE</td>
                    <td>
                        <span class="badge bg-warning text-dark">
                            75%
                        </span>
                    </td>

                </tr>

                <tr>

                    <td>22B81A0504</td>
                    <td>Sneha</td>
                    <td>EEE</td>
                    <td>
                        <span class="badge bg-danger">
                            65%
                        </span>
                    </td>

                </tr>

                <tr>

                    <td>22B81A0505</td>
                    <td>Arun</td>
                    <td>CSE</td>
                    <td>
                        <span class="badge bg-success">
                            95%
                        </span>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <div class="text-center mt-4">

        <a href="profile.html" class="btn btn-success">
    View Profile
</a>

        <a href="index.html" class="btn btn-primary">
            Back to Home
        </a>



    </div>

</div>

</body>
</html>
